[versions]
moddev = "2.0.142"
mixinmcpdecompile = "0.9.0"
minecraft = "26.1.2"
neoforge = "26.1.2.82"

mixinsquared = "0.3.7-beta.3"
anvilcraftlib = "2.0.0+snapshot.485"

geckolib = "5.5.2"
curios = "15.0.0-beta.2+26.1.2"
jei = "29.19.0.51"
jade = "26.1.8+neoforge"
