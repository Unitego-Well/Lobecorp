anvilcraftlib = { module = "dev.anvilcraft.lib:anvillib-neoforge-26.1", version.ref = "anvilcraftlib" }
geckolib = { module = "com.geckolib:geckolib-neoforge-26.1.2", version.ref = "geckolib" }
curios = { module = "top.theillusivec4.curios:curios-neoforge", version.ref = "curios" }
jeiapi = { module = "mezz.jei:jei-26.1.2-neoforge-api", version.ref = "jei" }
jei = { module = "mezz.jei:jei-26.1.2-neoforge", version.ref = "jei" }
jade = { module = "maven.modrinth:jade", version.ref = "jade" }
# 伤害血量显示
reretrodamageindicators = { module = "maven.modrinth:re-retro-damage-indicators", version.ref = "reretrodamageindicators" }

[bundles]

[plugins]
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
# 让AI或外界获取更详细的mixin数据
mixinmcpdecompile = { id = "dev.mixinmcp.decompile", version.ref = "mixinmcpdecompile" }
